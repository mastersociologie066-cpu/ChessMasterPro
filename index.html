
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessMaster Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #17212b;
  color: white;
  text-align: center;
}
header { padding: 20px 10px; }
h1 { color: #e8c36a; margin-bottom: 8px; }
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: min(92vw, 480px);
  aspect-ratio: 1;
  margin: 18px auto;
  border: 4px solid #e8c36a;
  box-sizing: border-box;
}
.square {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(25px, 8vw, 48px);
  cursor: pointer;
  user-select: none;
}
.light { background: #f0d9b5; }
.dark { background: #779556; }
.selected { background: #f6f669 !important; }
button {
  background: #e8c36a;
  color: #17212b;
  border: 0;
  border-radius: 8px;
  padding: 12px 18px;
  margin: 5px;
  font-weight: bold;
  cursor: pointer;
}
#status { padding: 10px; min-height: 24px; }
.note { color: #cbd5e1; font-size: 13px; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>♟ ChessMaster Pro</h1>
  <div>العب الشطرنج ضد الكمبيوتر</div>
</header>

<div id="status">أنت تلعب بالأبيض. اختر قطعة ثم مربعًا للتحرك.</div>
<div id="board"></div>

<button onclick="newGame()">مباراة جديدة</button>
<button onclick="undoMove()">التراجع عن النقلة</button>

<div class="note">
  نسخة تجريبية للموقع — سيتم دمج Stockfish في المرحلة التالية.
</div>

<script>
const game = new Chess();

const symbols = {
  wk:"♔", wq:"♕", wr:"♖", wb:"♗", wn:"♘", wp:"♙",
  bk:"♚", bq:"♛", br:"♜", bb:"♝", bn:"♞", bp:"♟"
};

let selected = null;
let thinking = false;

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const files = ["a","b","c","d","e","f","g","h"];

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const square = files[c] + (8-r);
      const piece = game.get(square);
      const cell = document.createElement("div");

      cell.className = "square " +
        ((r+c)%2 === 0 ? "light" : "dark");

      if (selected === square) cell.classList.add("selected");

      if (piece) {
        cell.textContent =
          symbols[piece.color + piece.type];
      }

      cell.onclick = () => clickSquare(square);
      board.appendChild(cell);
    }
  }
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function clickSquare(square) {
  if (thinking || game.game_over() || game.turn() !== "w") return;

  const piece = game.get(square);

  if (selected) {
    const move = game.move({
      from: selected,
      to: square,
      promotion: "q"
    });

    if (move) {
      selected = null;
      renderBoard();

      if (game.game_over()) {
        showResult();
      } else {
        setStatus("الكمبيوتر يفكر...");
        thinking = true;
        setTimeout(computerMove, 300);
      }
      return;
    }
  }

  if (piece && piece.color === "w") {
    selected = square;
  } else {
    selected = null;
  }

  renderBoard();
}

function computerMove() {
  const moves = game.moves();
  if (moves.length === 0) {
    thinking = false;
    showResult();
    return;
  }

  const move = moves[Math.floor(Math.random() * moves.length)];
  game.move(move);
  thinking = false;
  renderBoard();

  if (game.game_over()) {
    showResult();
  } else {
    setStatus("دورك — اختر قطعة بيضاء.");
  }
}

function showResult() {
  if (game.in_checkmate()) {
    setStatus(game.turn() === "w"
      ? "كش مات! فاز الكمبيوتر."
      : "كش مات! لقد فزت!");
  } else if (game.in_draw()) {
    setStatus("انتهت المباراة بالتعادل.");
  } else {
    setStatus("انتهت المباراة.");
  }
}

function newGame() {
  game.reset();
  selected = null;
  thinking = false;
  setStatus("مباراة جديدة! أنت تلعب بالأبيض.");
  renderBoard();
}

function undoMove() {
  if (thinking) return;

  game.undo();
  if (game.turn() === "b") game.undo();

  selected = null;
  renderBoard();
  setStatus("تم التراجع عن النقلات.");
}

renderBoard();
</script>
</body>
</html>
